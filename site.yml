# 서버에 접속하기 전에 필수 환경변수와 키 파일을 검증한다.
- name: 사전 검증 (preflight)
  hosts: servers
  gather_facts: false
  become: false
  tasks:
    # run_once / delegate_to 는 play가 아니라 block/task 수준 속성이다.
    - name: 로컬에서 한 번만 검증
      run_once: true
      delegate_to: localhost
      block:
        - name: 필수 환경변수 확인
          ansible.builtin.assert:
            that: lookup('env', item) | length > 0
            fail_msg: "필수 환경변수 {{ item }} 가 설정되지 않았습니다."
            quiet: true
          loop: "{{ required_env_vars }}"

        - name: SSH 개인키 파일 존재 확인
          ansible.builtin.stat:
            path: "{{ ansible_ssh_private_key_file }}"
          register: ssh_key_stat

        - name: SSH 개인키 파일 검증
          ansible.builtin.assert:
            that: ssh_key_stat.stat.exists
            fail_msg: "ANSIBLE_SSH_KEY_FILE 경로에 파일이 없습니다."
            quiet: true

- name: 기본 서버 셋팅
  hosts: servers
  become: true
  roles:
    - common
    - users
    - ssh
    - motd
    - docker
    - ufw
    - auditd

# GPU 서버에만 적용한다. GPU가 감지되지 않으면 role 안에서 건너뛴다.
- name: GPU 서버 셋팅
  hosts: gpu_servers
  become: true
  roles:
    - nvidia
